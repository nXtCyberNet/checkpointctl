# This rule is not used by the project forensic-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over forensics.cybernet.dev.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: forensic-operator
    app.kubernetes.io/managed-by: kustomize
  name: forensicsnapshot-admin-role
rules:
- apiGroups:
  - forensics.cybernet.dev
  resources:
  - forensicsnapshots
  verbs:
  - '*'
- apiGroups:
  - forensics.cybernet.dev
  resources:
  - forensicsnapshots/status
  verbs:
  - get
